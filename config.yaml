# Shared defaults for Outreach Studio.
# Keep this file business-neutral before sharing the software.
# Put private local settings in config.local.yaml instead.

tenant: "default"

# Optional. Set this in config.local.yaml to lock the Admin page.
admin_pin: ""

# Optional fallbacks. Prefer filling these in the Admin page.
founder_name: ""
calendar_name: ""

# Phase 2 only. Ignored unless you run scripts/enrich_batch.py yourself.
ollama:
  url: "http://localhost:11434/api/generate"
  model: "llama3.2:1b"
  timeout_seconds: 300

enrichment:
  max_page_chars: 4000
